name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  # The Coptic year grid is computed at build time, so without a rebuild it
  # would sit on whatever day the site was last deployed. 04:15 UTC is around
  # midnight in North America, where most readers are.
  schedule:
    - cron: '15 4 * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
